name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: docker.io/library/debian:13
            python: python3
          - distro: almalinux
            image: docker.io/library/almalinux:9
            python: python3.11

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install system dependencies
        env:
          DISTRO: ${{ matrix.distro }}
          PYTHON_BIN: ${{ matrix.python }}
        run: |
          set -eux

          case "${DISTRO}" in
            debian)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates git bash python3 python3-pip
              ;;
            almalinux)
              dnf -y upgrade --refresh
              dnf -y install \
                ca-certificates git tar gzip findutils bash which \
                dnf-plugins-core epel-release
              dnf -y config-manager --set-enabled crb || true
              dnf -y makecache
              dnf -y install \
                python3.11 python3.11-pip
              ;;
            *)
              echo "Unsupported CI distro: ${DISTRO}" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        env:
          PYTHON_BIN: ${{ matrix.python }}
        run: |
          "${PYTHON_BIN}" -m pip install --break-system-packages pytest

      - name: Run tests
        env:
          PYTHON_BIN: ${{ matrix.python }}
        run: |
          ./tests.sh

      - name: Notify on failure
        if: ${{ failure() }}
        env:
          WEBHOOK_URL: ${{ secrets.NODERED_WEBHOOK_URL }}
          REPOSITORY: ${{ forgejo.repository }}
          RUN_NUMBER: ${{ forgejo.run_number }}
          SERVER_URL: ${{ forgejo.server_url }}
        run: |
          curl -X POST \
               -H "Content-Type: application/json" \
               -d "{\"repository\":\"$REPOSITORY\",\"run_number\":\"$RUN_NUMBER\",\"status\":\"failure\",\"url\":\"$SERVER_URL/$REPOSITORY/actions/runs/$RUN_NUMBER\"}" \
               "$WEBHOOK_URL"
